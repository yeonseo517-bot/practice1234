<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>영어 낱말장</title>
  <meta name="description" content="카드를 넘기고, 퀴즈를 풀고, 철자를 직접 쓰며 영어 단어를 익히는 낱말장">
  <style>
    :root {
      --bg: #e9dfd0;
      --ink: #221c16;
      --muted: #6f6256;
      --line: #e3d3c0;
      --card: #fffaf3;
      --side: #2a241e;
      --accent: #c24b32;
      --sage: #1e6b52;
      --sage-bg: #e7f4ee;
      --bad-bg: #fde8e2;
      --shadow: 0 18px 40px rgba(70, 42, 18, 0.08);
      --serif: Georgia, "Palatino Linotype", Palatino, serif;
      --sans: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--ink);
      font-family: var(--sans);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.35), transparent 240px),
        var(--bg);
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    ::selection { background: #f0c7bf; }
    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .layout { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
    .side {
      background: var(--side);
      color: #f4ecdf;
      padding: 28px 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }
    .brand { display: flex; gap: 12px; align-items: center; }
    .mark {
      width: 42px; height: 42px;
      display: grid; place-items: center;
      background: var(--accent);
      color: white;
      font-family: var(--serif);
      font-size: 26px;
      border-radius: 12px;
      flex: 0 0 auto;
    }
    .brand strong { display: block; font-size: 18px; font-weight: 650; }
    .brand small { display: block; margin-top: 2px; color: #d9cbb8; }
    .modes, .cats { display: flex; flex-direction: column; gap: 4px; }
    .side-label {
      margin: 0 0 6px;
      color: #b7a894;
      font-size: 12px;
      letter-spacing: 0.08em;
    }
    .mode-btn, .cat-btn, .text-btn {
      border: 0;
      background: transparent;
      color: inherit;
      border-radius: 12px;
      text-align: left;
    }
    .mode-btn { padding: 10px 12px; }
    .mode-btn[aria-pressed="true"] { background: var(--accent); color: white; }
    .mode-btn:hover:not([aria-pressed="true"]),
    .cat-btn:hover:not([aria-pressed="true"]) { background: rgba(255, 255, 255, 0.06); }
    .cat-btn {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      color: #efe4d6;
    }
    .cat-btn span:last-child { color: #b7a894; font-variant-numeric: tabular-nums; }
    .cat-btn[aria-pressed="true"] { background: rgba(255, 255, 255, 0.1); color: #ffd9cf; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 10px 12px;
    }
    .stat b { display: block; font-family: var(--serif); font-size: 26px; font-weight: 400; }
    .stat span { color: #d9cbb8; font-size: 12px; }
    .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
    .text-btn { padding: 8px 12px; color: #e7c7be; }
    .text-btn:hover { color: white; }
    .fine { margin: 0; color: #b7a894; font-size: 12px; line-height: 1.5; padding: 0 12px; }
    .main { padding: 36px 40px 72px; }
    .wrap { width: min(760px, 100%); margin: 0 auto; }
    .hero {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 18px;
      align-items: flex-end;
      margin-bottom: 18px;
    }
    .date { margin: 0; color: var(--muted); font-size: 13px; }
    h1 { margin: 4px 0; font-size: 34px; font-weight: 650; letter-spacing: -0.03em; }
    .lede { margin: 0; color: var(--muted); }
    .daily {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px 12px;
      min-width: min(100%, 280px);
    }
    .daily-k { color: var(--muted); font-size: 12px; }
    .daily-en { font-family: var(--serif); font-size: 24px; line-height: 1.1; }
    .daily-ko { color: var(--muted); font-size: 13px; }
    .mobile-stats, .mobile-reset { display: none; }
    .chip {
      background: rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
    }
    .progress-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }
    .bar { height: 6px; background: rgba(80, 50, 20, 0.1); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
    .bar span { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
    .scene { perspective: 1200px; margin-bottom: 14px; }
    .card {
      display: grid;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    .card.flipped { transform: rotateY(180deg); }
    .face {
      grid-area: 1 / 1;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      pointer-events: none;
    }
    .card:not(.flipped) .front, .card.flipped .back { pointer-events: auto; }
    .back { transform: rotateY(180deg); }
    .panel, .face {
      background: var(--card);
      border-radius: 22px;
      border: 1px solid rgba(80, 50, 20, 0.08);
      border-left: 6px solid var(--accent);
      box-shadow: var(--shadow);
      padding: 26px 26px 22px;
    }
    .face-top, .entry-main, .actions, .nav, .summary-actions, .opt {
      display: flex;
      gap: 8px;
    }
    .face-top { flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 13px; }
    .pill {
      background: #f6ebe1;
      color: #8c3d2e;
      border-radius: 999px;
      padding: 3px 8px;
    }
    .kicker { margin: 22px 0 0; color: var(--muted); font-size: 13px; }
    .word {
      margin: 8px 0 12px;
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(46px, 8vw, 76px);
      line-height: 0.95;
      letter-spacing: -0.03em;
    }
    .mean {
      margin: 8px 0 14px;
      font-size: clamp(30px, 5vw, 46px);
      font-weight: 650;
      line-height: 1.25;
      letter-spacing: -0.03em;
    }
    .ex { margin: 0; font-family: var(--serif); font-size: 20px; font-style: italic; line-height: 1.45; }
    .ex-ko { margin: 8px 0 0; color: #4d433a; line-height: 1.55; }
    .note {
      margin: 14px 0 0;
      background: #f8f1e4;
      border-radius: 12px;
      padding: 10px 12px;
      color: #5c4a38;
      font-size: 14px;
      line-height: 1.5;
    }
    .actions { flex-wrap: wrap; margin-top: 22px; }
    .btn {
      border-radius: 999px;
      padding: 10px 16px;
      border: 1px solid transparent;
      background: #f3e7da;
      min-height: 44px;
    }
    .btn:hover:not(:disabled) { filter: brightness(0.98); }
    .btn.primary { background: var(--accent); color: white; }
    .btn.sage { background: var(--sage); color: white; }
    .btn.ghost { background: transparent; border-color: #ddcdbb; }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .nav { justify-content: space-between; }
    .keys { color: var(--muted); font-size: 13px; }
    kbd {
      font-family: var(--sans);
      border: 1px solid #ddcdbb;
      border-bottom-width: 2px;
      border-radius: 6px;
      padding: 1px 6px;
      background: white;
    }
    .prompt-k { margin: 0; color: var(--muted); }
    .prompt-ko { margin: 10px 0 4px; font-size: clamp(28px, 5vw, 42px); font-weight: 650; letter-spacing: -0.03em; line-height: 1.3; }
    .opt {
      width: 100%;
      align-items: center;
      text-align: left;
      background: #fffaf3;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      margin: 8px 0;
      min-height: 56px;
    }
    .opt:hover:not(:disabled) { border-color: var(--accent); }
    .opt-n {
      width: 28px; height: 28px;
      display: grid; place-items: center;
      border-radius: 99px;
      background: #f0e4d4;
      flex: 0 0 auto;
    }
    .opt-en { font-family: var(--serif); font-size: 24px; }
    .opt.good { background: var(--sage-bg); border-color: var(--sage); }
    .opt.bad { background: var(--bad-bg); border-color: var(--accent); }
    .opt.dim { opacity: 0.55; }
    .feedback { margin: 16px 0 0; font-weight: 650; }
    .feedback.ok { color: var(--sage); }
    .feedback.bad { color: var(--accent); }
    .hint { min-height: 1.4em; margin: 8px 0 0; color: var(--accent); }
    .type-form { display: flex; gap: 8px; margin-top: 18px; }
    .type-form input {
      flex: 1;
      min-width: 0;
      border-radius: 14px;
      border: 1px solid #ddcdbb;
      background: white;
      padding: 12px 14px;
      font-family: var(--serif);
      font-size: 28px;
    }
    .sheet { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); padding: 16px 16px 8px; }
    .search {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      background: #fff;
      margin-bottom: 8px;
    }
    .book-meta { margin: 0 8px 4px; color: var(--muted); font-size: 13px; }
    .group h3 {
      display: flex;
      justify-content: space-between;
      margin: 18px 8px 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }
    .entry-main {
      width: 100%;
      display: grid;
      grid-template-columns: 10px minmax(140px, 1fr) auto minmax(120px, 1.1fr);
      gap: 10px;
      align-items: center;
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      padding: 13px 8px;
    }
    .entry.open .entry-main { border-bottom-color: transparent; }
    .entry-en { font-family: var(--serif); font-size: 22px; }
    .entry-pos { color: var(--muted); font-size: 12px; }
    .entry-ko { color: #4d433a; }
    .dot { width: 8px; height: 8px; border-radius: 99px; background: #c8b8a4; }
    .dot.know { background: var(--sage); }
    .dot.learn { background: var(--accent); }
    .entry-more { padding: 0 8px 16px 26px; border-bottom: 1px solid var(--line); }
    .score { margin: 8px 0; font-family: var(--serif); font-size: 72px; line-height: 0.9; }
    .score small { font-size: 32px; color: var(--muted); }
    .summary-actions { flex-wrap: wrap; margin-top: 16px; }
    .empty { color: var(--muted); padding: 12px 8px 20px; }
    .sr {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
    #toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(12px);
      background: #2a241e;
      color: white;
      padding: 10px 14px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 720px) {
      .layout { grid-template-columns: 1fr; }
      .side { position: sticky; top: 0; z-index: 5; height: auto; padding: 14px; gap: 10px; }
      .stats, .side-foot, .brand small { display: none; }
      .modes, .cats { flex-direction: row; }
      .cats { overflow-x: auto; }
      .mode-btn, .cat-btn { flex: 0 0 auto; text-align: center; }
      .cat-btn { gap: 6px; }
      .main { padding: 14px 14px 40px; }
      .hero { flex-direction: column; align-items: stretch; margin-bottom: 10px; }
      .lede { display: none; }
      h1 { font-size: 26px; margin: 2px 0 0; }
      .mobile-stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
      .mobile-reset { display: inline-block; margin-top: 14px; background: transparent; border: 0; color: var(--muted); padding: 8px 0; }
      .keys { display: none; }
      .face { min-height: 0; }
    }
    @media (max-width: 640px) {
      .entry-main { grid-template-columns: 10px 1fr auto; }
      .entry-ko { grid-column: 2 / -1; }
      .type-form { flex-direction: column; }
      .daily { align-items: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card, #toast { transition: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status"></div>
  <script>
    const KEY = "english-wordbook-v1";
    const MODES = ["card", "quiz", "type", "book"];
    const CATS = [
      { id: "all", label: "전체" },
      { id: "review", label: "복습" },
      { id: "core", label: "기본" },

    ];
    const CAT_LABEL = { core: "기본", daily: "일상", feel: "감정", work: "일", travel: "여행", think: "사고" };
    const MODE_META = {

      quiz: ["퀴즈", "뜻에 맞는 영어 단어를 고르세요. 한 번에 10문제예요."],
      type: ["받아쓰기", "뜻을 보고 영어 철자를 적어 보세요."],

    const ALT = {
      neighbor: ["neighbour"],
      recognize: ["recognise"],

    };
    const WORDS = [
      { en: "achieve", ko: "이루다", pos: "동사", cat: "core", ex: "She achieved her goal.", exKo: "그녀는 목표를 이뤘어요." },
      { en: "avoid", ko: "피하다", pos: "동사", cat: "core", ex: "Avoid the crowded road.", exKo: "복잡한 길은 피하세요." },
      { en: "maintain", ko: "유지하다", pos: "동사", cat: "core", ex: "It is hard to maintain focus.", exKo: "집중을 유지하기가 어려워요." },
      { en: "improve", ko: "개선하다", pos: "동사", cat: "core", ex: "I want to improve my English.", exKo: "영어를 늘리고 싶어요." },
      { en: "require", ko: "필요로 하다", pos: "동사", cat: "core", ex: "This job requires patience.", exKo: "이 일에는 인내심이 필요해요." },
      { en: "suggest", ko: "제안하다", pos: "동사", cat: "core", ex: "She suggested a walk.", exKo: "그녀가 산책하자고 했어요." },
      { en: "consider", ko: "고려하다", pos: "동사", cat: "core", ex: "Consider both options.", exKo: "두 가지를 모두 고려해 보세요." },

      { en: "afford", ko: "여유가 되다", pos: "동사", cat: "core", ex: "I can't afford a new phone.", exKo: "새 전화기를 살 여유가 없어요.", note: "can이나 can't와 같이 쓰고, 돈이나 시간이 되는지를 말해요." },
      { en: "deserve", ko: "자격이 있다", pos: "동사", cat: "core", ex: "You deserve a break.", exKo: "당신은 쉴 자격이 있어요." },

      { en: "appointment", ko: "약속, 예약", pos: "명사", cat: "daily", ex: "I have an appointment at three.", exKo: "3시에 약속이 있어요." },
      { en: "laundry", ko: "빨래", pos: "명사", cat: "daily", ex: "The laundry isn't dry yet.", exKo: "빨래가 아직 안 말랐어요." },
      { en: "anxious", ko: "불안한", pos: "형용사", cat: "feel", ex: "I get anxious on planes.", exKo: "나는 비행기만 타면 불안해요.", note: "걱정이 되어 마음이 불편할 때 써요." },
      { en: "grateful", ko: "고마운", pos: "형용사", cat: "feel", ex: "I'm grateful for today.", exKo: "오늘이 고마워요." },
      { en: "frustrated", ko: "좌절한, 답답한", pos: "형용사", cat: "feel", ex: "He gets frustrated in traffic.", exKo: "그는 길이 막히면 답답해해요." },
      { en: "relieved", ko: "안도한", pos: "형용사", cat: "feel", ex: "She felt relieved.", exKo: "그녀는 안도했어요." },
      { en: "confident", ko: "자신 있는", pos: "형용사", cat: "feel", ex: "She felt confident.", exKo: "그녀는 자신 있었어요." },

      let line = "다시 보면 분명 늘어요.";
      if (pct === 100) line = "전부 맞혔어요.";
      else if (pct >= 80) line = "잘하고 있어요.";
      else if (pct >= 50) line = "절반을 넘겼어요.";
      const missedBtn = state.missed.length
        ? '<button class="btn sage" type="button" data-action="replay" data-kind="missed">틀린 단어만 다시</button>'
        : "";
      return '<section class="panel"><p class="prompt-k">결과</p><p class="score">' + ok + "<small> / " + total + '</small></p><h2 class="mean">' + line + "</h2>"
        + '<div class="summary-actions">' + missedBtn
        + '<button class="btn primary" type="button" data-action="replay" data-kind="all">다시 10문제</button>'
        + '<button class="btn ghost" type="button" data-action="mode" data-mode="book">단어장 보기</button></div></section>';
    }
    function emptyHtml() {
      const review = state.category === "review";
      return '<section class="panel"><h2 class="mean">' + (review ? "복습할 단어가 없어요" : "단어가 없어요") + "</h2><p>"
        + (review ? "카드에서 ‘한 번 더’를 누르거나, 퀴즈에서 틀리면 이곳에 모여요." : "다른 묶음을 골라 보세요.")
        + '</p><div class="actions"><button class="btn primary" type="button" data-action="cat" data-cat="all">전체 단어 보기</button></div></section>';
    }
    function bookEntries() {
      const q = state.query.trim().toLowerCase();
      let list = filtered();
      if (q) {
        list = list.filter((w) => [w.en, w.ko, w.ex, w.exKo, w.note || ""].some((part) => part.toLowerCase().indexOf(q) >= 0));
      }
      return list.slice().sort((a, b) => a.en.localeCompare(b.en));
    }
    function bookListHtml() {
      const items = bookEntries();
      if (!items.length) {
        const message = state.query ? "“" + state.query + "”에 맞는 단어가 없어요." : "이 묶음에는 단어가 없어요.";
        return '<p class="empty">' + esc(message) + "</p>";
      }
      const groups = [];
      if (!state.query && state.category === "all") {
        ["core", "daily", "feel", "work", "travel", "think"].forEach((cat) => {
          const groupItems = items.filter((w) => w.cat === cat);
          if (groupItems.length) groups.push({ label: CAT_LABEL[cat], items: groupItems });
        });
      } else {
        groups.push({ label: "", items: items });
      }
      return groups.map((group) => {
        const head = group.label ? '<h3>' + esc(group.label) + "<span>" + group.items.length + "</span></h3>" : "";
        return '<section class="group">' + head + group.items.map(entryHtml).join("") + "</section>";
      }).join("");
    }
    function entryHtml(word) {
      const open = state.openEn === word.en;
      const more = open
        ? '<div class="entry-more"><p class="ex" lang="en">' + esc(word.ex) + '</p><p class="ex-ko">' + esc(word.exKo) + "</p>" + noteHtml(word)
          + '<div class="actions"><button class="btn ghost" type="button" data-action="speak" data-say="' + esc(word.en) + '">발음</button>'
          + '<button class="btn sage" type="button" data-action="toggle-know" data-en="' + esc(word.en) + '">'
          + (statusClass(word.en) === "know" ? "다시 볼 단어로" : "아는 단어로") + "</button></div></div>"
        : "";
      return '<article class="entry' + (open ? " open" : "") + '"><button class="entry-main" type="button" data-action="open-word" data-en="' + esc(word.en) + '">'
        + '<span class="dot ' + statusClass(word.en) + '"></span><span class="entry-en" lang="en">' + esc(word.en) + "</span>"
        + '<span class="entry-pos">' + esc(word.pos) + '</span><span class="entry-ko">' + esc(word.ko) + "</span></button>" + more + "</article>";
    }
    function bookMetaText() {
      const cat = CATS.find((item) => item.id === state.category);
      return (cat ? cat.label : "전체") + " " + bookEntries().length + "개";
    }
    function bookHtml() {
      return '<div class="sheet"><input class="search" id="search" type="search" placeholder="영어, 뜻, 예문으로 찾기" value="' + esc(state.query) + '" aria-label="단어 검색">'
        + '<p class="book-meta" id="book-meta">' + esc(bookMetaText()) + '</p><div id="book-list">' + bookListHtml() + "</div></div>";
    }
    function stageHtml() {
      if (state.mode === "book") return bookHtml();
      if (state.empty) return emptyHtml();
      if (state.done) return summaryHtml();
      if (state.mode === "card") return cardHtml();
      if (state.mode === "quiz") return quizHtml();
      return typeHtml();
    }
    function shell() {
      const meta = MODE_META[state.mode];
      const daily = dailyWord();
      const modes = [
        ["card", "카드"],
        ["quiz", "퀴즈"],
        ["type", "받아쓰기"],
        ["book", "단어장"]
      ].map((item) => '<button class="mode-btn" type="button" data-action="mode" data-mode="' + item[0] + '" aria-pressed="' + (state.mode === item[0]) + '">' + item[1] + "</button>").join("");
      const cats = CATS.map((cat) => '<button class="cat-btn" type="button" data-action="cat" data-cat="' + cat.id + '" aria-pressed="' + (state.category === cat.id) + '"><span>' + cat.label + '</span><span data-count="' + cat.id + '">' + countFor(cat.id) + "</span></button>").join("");
      return '<div class="layout"><aside class="side"><div class="brand"><span class="mark">W</span><span><strong>영어 낱말장</strong><small>읽고, 고르고, 직접 쓰기</small></span></div>'
        + '<div><p class="side-label">학습</p><div class="modes">' + modes + "</div></div>"
        + '<div class="stats" id="stats">' + statsHtml() + "</div>"
        + '<div><p class="side-label">묶음</p><div class="cats">' + cats + "</div></div>"
        + '<div class="side-foot"><button class="text-btn" type="button" data-action="reset">기록 지우기</button><p class="fine">진도는 이 브라우저에만 저장돼요. 서버로 보내지 않아요.</p></div></aside>'
        + '<main class="main"><div class="wrap"><header class="hero"><div><p class="date">' + esc(koreanDate()) + "</p><h1>" + esc(meta[0]) + '</h1><p class="lede">' + esc(meta[1]) + '</p><div class="mobile-stats" id="mstats">' + mobileStatsHtml() + "</div></div>"
        + '<div class="daily"><div><div class="daily-k">오늘의 단어</div><div class="daily-en" lang="en">' + esc(daily.en) + '</div><div class="daily-ko">' + esc(daily.ko) + "</div></div>"
        + '<button class="btn ghost" type="button" data-action="speak" data-say="' + esc(daily.en) + '">듣기</button>'
        + '<button class="btn primary" type="button" data-action="daily">공부하기</button></div></header>'
        + '<div id="stage">' + stageHtml() + '</div><button class="mobile-reset" type="button" data-action="reset">기록 지우기</button><p id="live" class="sr" aria-live="polite"></p></div></main></div>';
    }
    function render() {
      ensureQuestion();
      document.getElementById("app").innerHTML = shell();
      afterRender();
    }
    function afterRender() {
      if (state.mode === "type" && !state.done && !state.empty && !state.typeResult) {
        const input = document.getElementById("answer");
        if (input) {
          input.focus();
          if (state.hint) input.select();
          else input.setSelectionRange(input.value.length, input.value.length);
        }
      }
      const front = document.querySelector(".face.front");
      const back = document.querySelector(".face.back");
      if (front && back) {
        front.inert = state.flipped;
        back.inert = !state.flipped;
      }
      const revealed = document.querySelector(".opt.good, .feedback");
      if (revealed) revealed.scrollIntoView({ block: "center" });
    }
    function updateCounts() {
      document.querySelectorAll("[data-count]").forEach((el) => {
        el.textContent = String(countFor(el.dataset.count));
      });
      const stats = document.getElementById("stats");
      if (stats) stats.innerHTML = statsHtml();
      const mobile = document.getElementById("mstats");
      if (mobile) mobile.innerHTML = mobileStatsHtml();
    }
    function refreshBook() {
      const list = document.getElementById("book-list");
      if (!list) return render();
      list.innerHTML = bookListHtml();
      const meta = document.getElementById("book-meta");
      if (meta) meta.textContent = bookMetaText();
      updateCounts();
    }
    function setMode(mode) {
      if (MODES.indexOf(mode) < 0) return;
      hush();
      state.mode = mode;
      state.customQueue = null;
      buildSession();
      save();
      render();
    }
    function setCategory(cat) {
      if (!CATS.some((item) => item.id === cat)) return;
      hush();
      state.category = cat;
      state.customQueue = null;
      buildSession();
      save();
      render();
    }
    function go(delta) {
      if (state.mode !== "card" && delta < 0) return;
      if (state.mode === "quiz" && delta > 0 && state.quiz && !state.quiz.done) return;
      if (state.mode === "type" && delta > 0 && !state.typeResult) return;
      const nextIndex = state.index + delta;
      if (nextIndex < 0) return;
      hush();
      if (nextIndex >= state.queue.length) {
        state.done = true;
        state.flipped = false;
        render();
        return;
      }
      state.index = nextIndex;
      state.done = false;
      state.flipped = false;
      state.quiz = null;
      state.typeResult = null;
      state.hint = "";
      state.draft = "";
      render();
    }
    function flip() {
      if (state.mode !== "card" || state.done || state.empty) return;
      state.flipped = !state.flipped;
      const card = document.getElementById("card");
      const word = currentWord();
      if (!card || !word) return render();
      card.classList.toggle("flipped", state.flipped);
      const front = card.querySelector(".front");
      const back = card.querySelector(".back");
      front.setAttribute("aria-hidden", state.flipped ? "true" : "false");
      back.setAttribute("aria-hidden", state.flipped ? "false" : "true");
      front.inert = state.flipped;
      back.inert = !state.flipped;
      const live = document.getElementById("live");
      if (live) live.textContent = state.flipped ? word.ko : word.en;
    }
    function mark(status) {
      const word = currentWord();
      if (!word) return;
      const rec = progress.words[word.en] || { correct: 0, wrong: 0 };
      rec.status = status;
      progress.words[word.en] = rec;
      touchDay();
      save();
      go(1);
    }
    function choose(index) {
      const q = state.quiz;
      if (!q || q.done || !q.options[index]) return;
      q.picked = index;
      q.done = true;
      const ok = q.options[index].en === q.answer.en;
      grade(q.answer, ok);
      if (ok) state.sessionCorrect += 1;
      else state.missed.push(q.answer);
      state.sessionTotal += 1;
      speak(q.answer.en);
      render();
    }
    function submitType(raw) {
      if (state.typeResult || state.done || state.empty) return;
      const word = currentWord();
      const input = String(raw || "").trim();
      state.draft = input;
      if (!input) {
        state.hint = "단어를 입력해 주세요.";
        render();
        return;
      }
      if (/[가-힣]/.test(input)) {
        state.hint = "뜻은 위에 있어요. 영어 철자를 적어 보세요.";
        render();
        return;
      }
      if (!canon(input)) {
        state.hint = "영어 알파벳으로 적어 주세요.";
        render();
        return;
      }
      const exact = matches(input, word);
      const almost = !exact && isAlmost(input, word);
      const ok = exact || almost;
      grade(word, ok);
      if (ok) state.sessionCorrect += 1;
      else state.missed.push(word);
      state.sessionTotal += 1;
      state.hint = "";
      state.typeResult = { ok: ok, almost: almost, input: input };
      speak(word.en);
      render();
    }
    function replay(kind) {
      state.customQueue = kind === "missed" ? uniqueWords(state.missed) : null;
      buildSession();
      render();
    }
    function openDaily() {
      const word = dailyWord();
      hush();
      state.mode = "card";
      state.category = "all";
      state.customQueue = null;
      buildSession();
      const found = state.queue.findIndex((item) => item.en === word.en);
      state.index = found >= 0 ? found : 0;
      state.done = false;
      state.flipped = false;
      save();
      render();
      speak(word.en);
    }
    function toggleKnow(en) {
      const word = WORDS.find((item) => item.en === en);
      if (!word) return;
      const rec = progress.words[en] || { correct: 0, wrong: 0 };
      rec.status = rec.status === "know" ? "learn" : "know";
      progress.words[en] = rec;
      touchDay();
      save();
      if (state.mode === "book") refreshBook();
      else render();
    }
    function resetAll() {
      if (!confirm("학습 기록을 모두 지울까요? 이 브라우저에 저장된 진도만 사라집니다.")) return;
      progress = fresh();
      state.mode = "card";
      state.category = "all";
      state.query = "";
      state.customQueue = null;
      state.openEn = "";
      save();
      buildSession();
      render();
    }

    let progress = load();
    const state = {
      mode: progress.ui.mode,
      category: progress.ui.category,
      query: "",
      queue: [],
      index: 0,
      flipped: false,
      done: false,
      empty: false,
      quiz: null,
      typeResult: null,
      hint: "",
      draft: "",
      sessionCorrect: 0,
      sessionTotal: 0,
      missed: [],
      customQueue: null,
      openEn: ""
    };

    const seen = {};
    WORDS.forEach((word) => {
      if (!word.en || !word.ko || !word.pos || !CAT_LABEL[word.cat] || !word.ex || !word.exKo || seen[word.en]) {
        throw new Error("단어 데이터가 올바르지 않습니다: " + word.en);
      }
      seen[word.en] = true;
    });

    document.addEventListener("click", (event) => {
      const btn = event.target.closest("[data-action]");
      if (!btn || btn.disabled) return;
      const action = btn.dataset.action;
      if (action === "speak") speak(btn.dataset.say || "");
      else if (action === "mode") setMode(btn.dataset.mode);
      else if (action === "cat") setCategory(btn.dataset.cat);
      else if (action === "flip") flip();
      else if (action === "next") go(1);
      else if (action === "prev") go(-1);
      else if (action === "know") mark("know");
      else if (action === "learn") mark("learn");
      else if (action === "choose") choose(Number(btn.dataset.i));
      else if (action === "replay") replay(btn.dataset.kind);
      else if (action === "daily") openDaily();
      else if (action === "open-word") {
        state.openEn = state.openEn === btn.dataset.en ? "" : btn.dataset.en;
        refreshBook();
      } else if (action === "toggle-know") toggleKnow(btn.dataset.en);
      else if (action === "reset") resetAll();
    });
    document.addEventListener("submit", (event) => {
      if (event.target.id !== "type-form") return;
      event.preventDefault();
      const data = new FormData(event.target);
      submitType(data.get("answer"));
    });
    document.addEventListener("input", (event) => {
      if (event.target.id === "search") {
        state.query = event.target.value;
        refreshBook();
        return;
      }
      if (event.target.id === "answer") {
        state.draft = event.target.value;
        if (state.hint) {
          state.hint = "";
          const hint = document.getElementById("hint");
          if (hint) hint.textContent = "";
        }
      }
    });
    document.addEventListener("keydown", (event) => {
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if (state.mode === "book") return;
      if (event.key === " " && tag !== "BUTTON" && state.mode === "card") {
        event.preventDefault();
        flip();
      } else if (event.key === "ArrowRight") {
        event.preventDefault();
        if (!state.done) go(1);
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        if (!state.done) go(-1);
      } else if (state.mode === "quiz" && /^[1-4]$/.test(event.key)) {
        choose(Number(event.key) - 1);
      }
    });

    buildSession();
    render();
  </script>
</body>
</html>
